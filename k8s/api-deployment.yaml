apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-veille-api
  namespace: medical-veille
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: medical-veille-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://meduser:medpassword@postgres:5432/medical_veille
            - name: MONGO_URL
              value: mongodb://meduser:medpassword@mongodb:27017/medical_veille?authSource=admin
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: ELASTIC_URL
              value: http://elasticsearch:9200
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: RABBITMQ_URL
              value: amqp://meduser:medpassword@rabbitmq:5672//
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-veille-secret
                  key: SECRET_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-veille-secret
                  key: GROQ_API_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: medical-veille
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP