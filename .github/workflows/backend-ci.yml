name: 🐍 Backend CI

on:
  push:
    branches: [master, develop]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : Tests Python
  # ─────────────────────────────────────────
  test:
    name: 🧪 Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov flake8

      - name: 🔍 Lint avec flake8
        run: |
          flake8 backend/ --max-line-length=120 --exclude=__pycache__,.venv

      - name: ✅ Run tests
        run: |
          pytest backend/tests/ -v --cov=backend --cov-report=xml --cov-report=term
        env:
          # Les secrets sont définis dans GitHub → Settings → Secrets
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: 📊 Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────
  # JOB 2 : Build & Push Docker image
  # ─────────────────────────────────────────
  build-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test # ne tourne que si les tests passent
    if: github.ref == 'refs/heads/master' # seulement sur master

    permissions:
      contents: read
      packages: write # nécessaire pour GHCR

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token auto-généré par GitHub

      - name: 🏷️ Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-          # ex: sha-abc1234
            type=ref,event=branch          # ex: master
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: ⚡ Setup Buildx (build multi-plateforme)
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha   # cache GitHub Actions
          cache-to: type=gha,mode=max
